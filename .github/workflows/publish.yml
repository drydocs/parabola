name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Build & Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # npm's OIDC trusted publishing requires npm CLI >=11.5.1, which needs
          # Node >=22.14.0 to ship it. pnpm doesn't support OIDC publishing yet
          # (github.com/pnpm/pnpm/issues/9812, and it actively 404s on pnpm 11 per
          # github.com/pnpm/pnpm/issues/11513), so the publish step below uses npm
          # directly rather than pnpm, even though everything before it uses pnpm.
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - run: npm install -g npm@latest
      - run: npm publish --access public
